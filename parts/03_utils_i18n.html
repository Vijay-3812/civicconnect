<script>
/* ============================================================================
 * CivicConnect — AI-assisted civic issue reporting (single-file demo)
 * ----------------------------------------------------------------------------
 * WHAT'S INSIDE
 *   • Store ......... single in-memory state + pub/sub render loop (localStorage optional)
 *   • Services ...... classifyCategory, estimateSeverity, sentimentScore, moderate,
 *                     detectDuplicates (TF-IDF cosine + Haversine decay), priorityScore,
 *                     summarizeForOfficials, Notifications, RBAC guards
 *   • Views ......... Landing, Report wizard, Live Map, Detail, Citizen/Official/Admin dashboards
 *   • Motion ........ intro draw-in, GSAP reveals + pinned how-it-works, 3D tilt, confetti,
 *                     FLIP detail open, radar sweep, comparison slider, guided demo
 *   • i18n .......... full EN / தமிழ் dictionary (labels, statuses, toasts, demo captions)
 *   • A11y .......... large UI, high contrast, reduced motion, low-bandwidth text-only mode
 *
 * HOW TO SWAP IN A REAL BACKEND (FastAPI + Supabase + Gemini)
 *   1. Auth ............ replace AuthService.login/register with supabase.auth.signInWithPassword()
 *                        and insert a row in `profiles (id, role, department_id, name)`.
 *   2. classifyCategory -> POST /v1/classify        (FastAPI + Gemini 1.5 Flash, Tamil+English prompt)
 *   3. estimateSeverity -> POST /v1/severity        (Gemini function-calling w/ POI context)
 *   4. sentimentScore   -> POST /v1/sentiment       (sentence-transformers / IndicBERT head)
 *   5. moderate         -> POST /v1/moderate        (Perspective-style classifier + spam rules)
 *   6. detectDuplicates -> POST /v1/duplicates      (pgvector/sentence-transformers embedding +
 *                        PostGIS: ST_DWithin(geog, point, 150) in `complaints`)
 *   7. priorityScore    -> POST /v1/priority        (same weights; POIs from a `pois` table)
 *   8. summarizeForOfficials -> POST /v1/summary    (Gemini on the filtered complaint rows)
 *   9. Media            -> supabase.storage.from('complaint-media').upload() → store public URL
 *  10. Realtime         -> supabase.channel('complaints').on('postgres_changes', ...) replaces Notify.push
 *  11. SLA/cron         -> pg_cron job marks overdue; status machine enforced by a Postgres trigger.
 *  Every service below is a pure function returning a plain object: swap the body, keep the shape.
 * ========================================================================== */

/* ==========================================================================
 * 0. UTILS
 * ======================================================================== */
const Utils = (() => {
  /** Query helper. */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  /** Safe localStorage: never throws, degrades to a no-op store. */
  const storage = {
    get(key, fallback = null) {
      try { const raw = window.localStorage.getItem(key); return raw == null ? fallback : JSON.parse(raw); }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    }
  };

  const uid = (prefix = 'id') => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const round = (n, d = 1) => Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
  const escapeHtml = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const debounce = (fn, ms = 220) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const throttle = (fn, ms = 60) => { let last = 0, raf = 0; return (...a) => { const now = performance.now(); if (now - last < ms) return; last = now; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => fn(...a)); }; };

  /** Dates */
  const now = () => Date.now();
  const addHours = (ts, h) => ts + h * 3600 * 1000;
  const fmtDate = (ts, lang = 'en') => new Date(ts).toLocaleString(lang === 'ta' ? 'ta-IN' : 'en-IN', { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  const fmtDay = (ts, lang = 'en') => new Date(ts).toLocaleDateString(lang === 'ta' ? 'ta-IN' : 'en-IN', { day: '2-digit', month: 'short' });
  const ago = (ts, lang = 'en') => {
    const s = Math.max(1, Math.floor((now() - ts) / 1000));
    const units = lang === 'ta'
      ? [[31536000, 'ஆண்டு'], [2592000, 'மாதம்'], [86400, 'நாள்'], [3600, 'மணி'], [60, 'நிமிடம்'], [1, 'வினாடி']]
      : [[31536000, 'y'], [2592000, 'mo'], [86400, 'd'], [3600, 'h'], [60, 'm'], [1, 's']];
    for (const [secs, label] of units) if (s >= secs) return Math.floor(s / secs) + (lang === 'ta' ? ' ' + label + ' முன்' : label);
    return 'now';
  };
  const hoursLeft = (due) => Math.round((due - now()) / 36e5);

  /** Geo — Haversine distance in metres. */
  function haversine(a, b) {
    if (!a || !b) return Infinity;
    const R = 6371000, toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  const fmtDist = (m) => (m < 950 ? Math.round(m / 10) * 10 + ' m' : round(m / 1000, 1) + ' km');

  /** Text */
  const tokenize = (text) => String(text || '').toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
  const truncate = (s, n = 90) => (String(s || '').length > n ? String(s).slice(0, n - 1).trimEnd() + '…' : String(s || ''));
  const initials = (name = '?') => name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const hashHue = (str = '') => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360; return h; };
  const colorFor = (str) => `linear-gradient(135deg,hsl(${hashHue(str)} 70% 52%),hsl(${(hashHue(str) + 48) % 360} 72% 44%))`;

  /** Inline SVG placeholder artwork — keeps the app image-free but never empty. */
  function placeholderImage(seed = 'civic', label = '') {
    const hue = hashHue(seed);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(${hue} 72% 26%)"/><stop offset=".55" stop-color="hsl(${(hue + 46) % 360} 68% 34%)"/>
        <stop offset="1" stop-color="hsl(${(hue + 96) % 360} 66% 22%)"/></linearGradient>
        <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,.22)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>
      </defs>
      <rect width="640" height="420" fill="url(#g)"/>
      <circle cx="132" cy="96" r="76" fill="rgba(255,255,255,.10)"/>
      <circle cx="540" cy="330" r="120" fill="rgba(255,255,255,.07)"/>
      <path d="M0 320 Q160 244 320 316 T640 300 V420 H0Z" fill="rgba(0,0,0,.32)"/>
      <path d="M0 356 Q200 300 380 356 T640 344 V420 H0Z" fill="rgba(0,0,0,.45)"/>
      <rect x="0" y="0" width="640" height="420" fill="url(#s)"/>
      <text x="36" y="392" font-family="Sora,Inter,sans-serif" font-size="26" font-weight="700" fill="rgba(255,255,255,.78)">${Utils.escapeHtml(label).slice(0, 34)}</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /** Canvas downscale for uploads (max edge 1280, JPEG q0.72) — keeps memory sane. */
  function downscaleImage(file, maxEdge = 1280, quality = 0.72) {
    return new Promise((resolve) => {
      if (!file || !/^image\//.test(file.type)) { resolve(null); return; }
      const reader = new FileReader();
      reader.onerror = () => resolve(null);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => resolve(null);
        img.onload = () => {
          try {
            const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', quality));
          } catch (e) { resolve(reader.result); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function readVideo(file) {
    return new Promise((resolve) => {
      if (!file) { resolve(null); return; }
      const r = new FileReader();
      r.onerror = () => resolve(null);
      r.onload = () => resolve(r.result);
      r.readAsDataURL(file);
    });
  }

  /** DOM/format bits used by every view. */
  const statusClass = (c) => Store.statusColorKey(c);
  const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);

  /** Accessible modal focus trap. */
  function trapFocus(container, event) {
    const focusables = $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', container)
      .filter((el) => !el.disabled && el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }

  /** CSV export via Blob download. */
  function downloadCSV(filename, rows) {
    if (!rows || !rows.length) { Toast.show('Nothing to export', 'warn'); return false; }
    const head = Object.keys(rows[0]);
    const esc = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const csv = [head.join(','), ...rows.map((r) => head.map((h) => esc(r[h])).join(','))].join('\r\n');
    try {
      const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
      return true;
    } catch (e) { Toast.show('Download blocked by the browser', 'err'); return false; }
  }

  return { $, $$, storage, uid, clamp, round, escapeHtml, debounce, throttle, now, addHours, fmtDate, fmtDay, ago,
    hoursLeft, haversine, fmtDist, tokenize, truncate, initials, hashHue, colorFor, placeholderImage,
    downscaleImage, readVideo, statusClass, pct, trapFocus, downloadCSV };
})();

}
